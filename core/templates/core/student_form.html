{% extends 'core/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>{{ title }}</h1>
    {% if form.errors %}
        <div class="form-error-summary" role="alert" aria-live="assertive">
            <p>Please correct the errors below and try again.</p>
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save student</button>
    </form>
</section>
{% endblock %}
