server {
    listen 443 ssl http2;
    server_name hostel.example.edu;
    ssl_certificate /etc/letsencrypt/live/hostel.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostel.example.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location /static/ { alias /srv/hostel-management/staticfiles/; }
    location / { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
server { listen 80; server_name hostel.example.edu; return 301 https://$host$request_uri; }
